<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maracaibo — Venezuelan & Caribbean Cuisine · Union City, NJ</title>
    <meta
      name="description"
      content="Maracaibo in Union City, NJ: classic Venezuelan dishes and Venezuelan & Caribbean fusion cuisine. Reserve a table, order online, plan private events and catering."
    />
    <!-- Private demo: keep out of search engines until the restaurant approves publication. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f0c09" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable web app: opened from the home screen it runs full screen, without browser bars -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maracaibo" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="Maracaibo — Union City, NJ" />
    <meta property="og:description" content="Classic Venezuelan dishes and Venezuelan & Caribbean fusion cuisine." />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/images/reception.webp" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Maracaibo",
        "servesCuisine": ["Venezuelan", "Caribbean"],
        "telephone": "+1-201-300-4445",
        "url": "https://www.maracaibonj.com/",
        "menu": "https://www.maracaibonj.com/menu",
        "acceptsReservations": "True",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1218 John F. Kennedy Blvd",
          "addressLocality": "Union City",
          "addressRegion": "NJ",
          "postalCode": "07087",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"], "opens": "11:30", "closes": "22:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Friday", "Saturday"], "opens": "11:30", "closes": "23:00" }
        ],
        "sameAs": ["https://www.instagram.com/maracaibonj/"]
      }
    </script>

    <script>
      // Decide before first paint whether the cinematic intro plays, so the homepage never flashes first.
      (function () {
        var seen = false
        try { seen = sessionStorage.getItem('mcb:intro-seen') === '1' } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var skipParam = /[?&]intro=skip/.test(location.search)
        var forceParam = /[?&]intro=play/.test(location.search)
        var play = forceParam || (!seen && !reduce && !skipParam)
        document.documentElement.setAttribute('data-intro', play ? 'play' : 'done')
      })()
    </script>
    <style>
      html, body { background: #0f0c09; }
      html[data-intro='play'] body { overflow: hidden; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="color:#efe6d6;font-family:Georgia,serif;padding:2rem;text-align:center">
        Maracaibo · 1218 John F. Kennedy Blvd, Union City, NJ 07087 · (201) 300-4445 ·
        <a style="color:#c9a76a" href="https://www.maracaibonj.com/menu">Menu</a>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
